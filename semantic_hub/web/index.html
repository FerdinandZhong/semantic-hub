<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Semantic Hub · Workspace</title>
    <link rel="icon" href="/static/favicon.svg" />
    <link rel="stylesheet" href="/v2/assets/workspace.css" />
    <script src="/v2/assets/workspace.js" defer></script>
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="/v2"
        ><img src="/static/cloudera-wordmark.png" alt="Cloudera" /><span
          >SEMANTIC HUB</span
        ></a
      ><span class="nav-label">WORKSPACE</span>
      <nav aria-label="Workspace">
        <button data-view="studio">◈ <span>Semantic Studio</span></button
        ><button data-view="sources">▤ <span>Data sources</span></button
        ><button data-view="tables">▦ <span>Tables</span></button
        ><button data-view="chat">◇ <span>Talk to your data</span></button>
      </nav>
      <span class="nav-label">MANAGE</span>
      <nav>
        <button data-view="providers">
          ↗ <span>Builders & connections</span></button
        ><a href="/demo/materials">Supporting materials</a
        ><a href="/demo/llm">Model configuration</a>
      </nav>
      <div class="sidebar-bottom">
        <span class="dot"></span> Provider workspace
        <span class="tag">v2 preview</span
        ><a href="/demo">Open classic workspace ↗</a>
      </div>
    </aside>
    <div class="main">
      <header>
        <span
          >Workspace <span class="slash">/</span>
          <b id="breadcrumb">Semantic Studio</b></span
        ><a href="/docs">API reference ↗</a>
      </header>
      <div class="workspace-bar">
        <label for="workspace">WORKSPACE</label
        ><select id="workspace" aria-label="Selected workspace"></select
        ><span id="provider-label" class="tag"></span
        ><button id="refresh" class="quiet">Refresh</button>
      </div>
      <div id="notice" role="status" hidden></div>
      <main id="content" aria-live="polite"></main>
    </div>
    <dialog id="setup">
      <form id="setup-form">
        <div class="dialog-heading">
          <h2 id="setup-title"></h2>
          <button
            type="button"
            id="close-dialog"
            class="quiet"
            aria-label="Close dialog"
          >
            ✕
          </button>
        </div>
        <div id="setup-fields"></div>
        <p id="setup-error" role="alert"></p>
        <button class="primary" type="submit">Save</button>
      </form>
    </dialog>
  </body>
</html>
