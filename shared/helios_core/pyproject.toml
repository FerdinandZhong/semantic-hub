[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helios-core"
version = "1.0.0"
description = "Helios core: shared semantic query and data governance layer"
authors = [{name = "Helios Team"}]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "cryptography>=46,<51",  # encrypted local model credentials
    "pyarrow>=14.0",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",  # ontology mappings (helios_core.ontology.mapping)
    "sqlglot>=29,<30",  # semantic dependency parsing and compilation
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["helios_core"]
