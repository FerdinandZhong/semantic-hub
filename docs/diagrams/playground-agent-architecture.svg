<text x="48" y="51" class="label" style="fill:#f26332">SEMANTIC HUB</text>
<text x="48" y="97" class="title">Playground agent architecture</text>
<text x="48" y="128" class="sub">Current implementation · one tool-using agent · version-pinned data and evidence</text>
