<text x="1155" y="315" class="body">Exact cohort match; overlap is insufficient</text>
<text x="1155" y="340" class="body">Enforce fields, joins, and metric filters</text>
<text x="1155" y="365" class="body">Compile SQL from reviewed definitions</text>
