<text x="70" y="259" class="h">User question</text>
<text x="70" y="290" class="body">Original intent</text>
<text x="70" y="315" class="body">Time · population · units</text>
<text x="70" y="340" class="body">Selected published version</text>
<rect x="337" y="224" width="348" height="178" rx="14" fill="#ffffff" stroke="#ff5b2a" stroke-width="3"/>
