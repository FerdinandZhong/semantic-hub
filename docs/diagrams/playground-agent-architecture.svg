<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img">
<title>Playground — from question to checked answer</title><desc>The agent prepares an interpretation. The user authorizes execution with Run.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#245EDB"/></marker></defs>
<rect width="1500" height="820" fill="#F5F8FC"/>
<text data-id="brand" x="50" y="36.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#245EDB">SEMANTIC HUB  /  IMPLEMENTED ARCHITECTURE</text>
<text data-id="title" x="50" y="87.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#14243B">Playground — from question to checked answer</text>
<text data-id="subtitle" x="50" y="134.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52647A">The agent prepares an interpretation. The user authorizes execution with Run.</text>
<rect x="60" y="230" width="380" height="116" rx="12" fill="white" stroke="#CCD7E4" stroke-width="2"/>
<text data-id="question-title" x="82" y="266.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#14243B">Question</text>
<text data-id="question-line-0" x="82" y="310.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#52647A">Selected release + original scope</text>
<rect x="560" y="230" width="380" height="116" rx="12" fill="white" stroke="#CCD7E4" stroke-width="2"/>
<text data-id="agent-title" x="582" y="266.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#14243B">Harness agent</text>
<text data-id="agent-line-0" x="582" y="310.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#52647A">Inspect context and call bounded tools</text>
<rect x="1060" y="230" width="380" height="116" rx="12" fill="white" stroke="#CCD7E4" stroke-width="2"/>
<text data-id="plan-title" x="1082" y="266.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#14243B">Checked plan</text>
<text data-id="plan-line-0" x="1082" y="310.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#52647A">Server validation + query review</text>
<polyline points="440,288 560,288" fill="none" stroke="#245EDB" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="940,288 1060,288" fill="none" stroke="#245EDB" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="560" y="460" width="380" height="116" rx="12" fill="#EDF3FF" stroke="#CCD7E4" stroke-width="2"/>
<text data-id="context-title" x="582" y="496.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#14243B">Published context</text>
<text data-id="context-line-0" x="582" y="540.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#52647A">Definitions, passages, and source binding</text>
<polyline points="750,460 750,346" fill="none" stroke="#245EDB" stroke-width="2" marker-end="url(#arrow)"/>
<text data-id="context-agent-label" x="770" y="407.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#245EDB">Read</text>
<rect x="1060" y="620" width="380" height="116" rx="12" fill="white" stroke="#CCD7E4" stroke-width="2"/>
<text data-id="run-title" x="1082" y="656.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#14243B">User clicks Run</text>
<text data-id="run-line-0" x="1082" y="700.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#52647A">Revalidate release, scope, and plan</text>
<rect x="560" y="620" width="380" height="116" rx="12" fill="white" stroke="#CCD7E4" stroke-width="2"/>
<text data-id="execute-title" x="582" y="656.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#14243B">Execute</text>
<text data-id="execute-line-0" x="582" y="700.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#52647A">DuckDB query or cited document QA</text>
<rect x="60" y="620" width="380" height="116" rx="12" fill="#F0F8F3" stroke="#CCD7E4" stroke-width="2"/>
<text data-id="answer-title" x="82" y="656.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#14243B">Answer + provenance</text>
<text data-id="answer-line-0" x="82" y="700.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#52647A">Result, SQL or citations, and version</text>
<polyline points="1250,346 1250,620" fill="none" stroke="#245EDB" stroke-width="2" marker-end="url(#arrow)"/>
<text data-id="plan-run-label" x="1270" y="472.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#245EDB">Inspect interpretation</text>
<polyline points="1060,678 940,678" fill="none" stroke="#245EDB" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="560,678 440,678" fill="none" stroke="#245EDB" stroke-width="2" marker-end="url(#arrow)"/>
<text data-id="footer-0" x="50" y="778.5" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#52647A">Unsupported scope or missing data → clarification or limitation. No executable plan is issued.</text>
</svg>
