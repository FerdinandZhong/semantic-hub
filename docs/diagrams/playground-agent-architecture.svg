<text x="359" y="290" class="body">Query coordinator</text>
<text x="359" y="315" class="body">Chooses bounded tools</text>
<text x="359" y="340" class="body">Preserves the original question</text>
<text x="359" y="365" class="body">No direct numeric answer</text>
<path d="M278 299 H326" class="edge"/>
<text x="337" y="436" class="label">CONFIGURABLE QUERY MODEL</text>
