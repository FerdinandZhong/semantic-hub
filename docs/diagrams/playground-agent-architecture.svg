<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">Semantic Hub Playground — current agent architecture</title><desc id="desc">Official DeepSeek Harness coordinates bounded semantic tools. The server validates original question scope before a user can run a version-pinned query. Skills and release-scoped audit memory support the coordinator.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#345be8" stroke-width="1.8"/></marker><marker id="mutedArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#8090ae" stroke-width="1.5"/></marker></defs>
<rect width="1600" height="1100" fill="#f6f8fc"/>
