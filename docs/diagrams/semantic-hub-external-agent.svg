<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#345be8" stroke-width="2"/></marker></defs><rect width="1400" height="800" fill="#f6f8fc"/><style>text{font-family:Arial,sans-serif;fill:#172640}.title{font-size:30px;font-weight:bold}.head{font-size:22px;font-weight:bold}.body{font-size:17px}.note{font-size:15px;fill:#52647f}.edge{fill:none;stroke:#345be8;stroke-width:3;marker-end:url(#a)}</style><text x="40" y="48" class="note">SEMANTIC HUB</text><text x="40" y="88" class="title">External agent architecture</text><text x="40" y="120" class="note">Published context and version control in the Hub · advanced reasoning in the consuming application</text><rect x="40" y="180" width="235" height="150" rx="14" fill="white" stroke="#dbe2ef" stroke-width="1.5"/><text x="60" y="215" class="head">User request</text><text x="60" y="250" class="body">Business question</text><text x="60" y="276" class="body">Requested time and scope</text><text x="60" y="302" class="body">Conversation context</text><rect x="330" y="180" width="320" height="190" rx="14" fill="white" stroke="#ff5b2a" stroke-width="3"/><text x="350" y="215" class="head">CAI Agent Studio</text><text x="350" y="250" class="body">Conversation manager</text><text x="350" y="276" class="body">Semantic context specialist</text><text x="350" y="302" class="body">Query / evidence specialist</text><text x="350" y="328" class="body">Prepared demo configuration</text><rect x="710" y="180" width="280" height="190" rx="14" fill="white" stroke="#dbe2ef" stroke-width="1.5"/><text x="730" y="215" class="head">MCP adapter</text><text x="730" y="250" class="body">12 read-only tools</text><text x="730" y="276" class="body">Real MCP SDK · stdio</text><text x="730" y="302" class="body">HTTP client to Hub API</text><text x="730" y="328" class="body">No direct state database</text><rect x="1050" y="180" width="310" height="190" rx="14" fill="white" stroke="#dbe2ef" stroke-width="1.5"/><text x="1070" y="215" class="head">Consumer API</text><text x="1070" y="250" class="body">Bearer-authenticated</text><text x="1070" y="276" class="body">Published versions only</text><text x="1070" y="302" class="body">Context hashes + bundles</text><text x="1070" y="328" class="body">No Studio editing routes</text><path d="M275 255 H320" class="edge"/><path d="M650 270 H700" class="edge"/><path d="M990 270 H1040" class="edge"/><rect x="710" y="435" width="650" height="145" rx="14" fill="white" stroke="#dbe2ef" stroke-width="1.5"/><text x="730" y="470" class="head">Published semantic context</text><text x="730" y="505" class="body">Ossie definitions · metadata · ontology · lineage</text><text x="730" y="531" class="body">Reviewed document passages · immutable version hashes</text><text x="730" y="557" class="body">Keyword search · configured embeddings · Lance cache</text><path d="M1205 370 V425" class="edge"/><rect x="40" y="435" width="610" height="145" rx="14" fill="white" stroke="#dbe2ef" stroke-width="1.5"/><text x="60" y="470" class="head">Agent execution choices</text><text x="60" y="505" class="body">Compile a typed query and test the bounded local sample</text><text x="60" y="531" class="body">Use semantic definitions with the agent’s own data tools</text><text x="60" y="557" class="body">Preserve scope; return no data when evidence does not match</text><path d="M710 505 H660" class="edge"/><path d="M490 370 V425" class="edge"/><rect x="40" y="640" width="1320" height="105" rx="14" fill="white" stroke="#dbe2ef" stroke-width="1.5"/><text x="60" y="675" class="head">Traceable answer</text><text x="60" y="710" class="body">Value or supported document claim · model version · source snapshot · SQL or citations · explicit missing-data status</text><path d="M345 580 V630" class="edge"/><text x="710" y="620" class="note">Local API and MCP path verified. Hosted CAI execution remains pending.</text></svg>