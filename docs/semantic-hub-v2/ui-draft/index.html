<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Semantic Hub · UI design review</title>
    <style>
      :root {
        font:
          14px Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #263247;
        background: #f6f8fc;
        --blue: #2d62df;
        --line: #e3e8f0;
        --muted: #708096;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a {
        cursor: pointer;
      }
      button {
        border: 1px solid #dce2ec;
        border-radius: 7px;
        background: white;
        color: inherit;
        padding: 9px 13px;
      }
      button:hover {
        background: #eef3ff;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #94b5ff;
        outline-offset: 2px;
      }
      a {
        color: var(--blue);
        text-decoration: none;
      }
      svg {
        width: 19px;
        height: 19px;
        flex-shrink: 0;
        vertical-align: middle;
      }
      aside {
        position: fixed;
        inset: 38px auto 0 0;
        width: 224px;
        background: #fafbfe;
        border-right: 1px solid var(--line);
        padding: 28px 16px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        padding: 0 12px 32px;
      }
      .brand strong {
        font-size: 23px;
        color: #ff5b16;
        letter-spacing: 0.5px;
      }
      .brand small {
        display: block;
        font-size: 9px;
        letter-spacing: 2.2px;
        color: #687792;
        margin-top: 10px;
        font-weight: 700;
      }
      .navlabel {
        font-size: 10px;
        letter-spacing: 1.5px;
        color: #8c99ac;
        margin: 18px 12px 9px;
      }
      nav {
        display: grid;
        gap: 5px;
      }
      nav button {
        font-size: 13px;
        line-height: 1.35;
        display: flex;
        gap: 12px;
        align-items: center;
        text-align: left;
        border: 0;
        background: none;
        color: #5a6981;
        padding: 12px;
      }
      nav button.active {
        color: #2554bc;
        background: #eaf0fd;
        font-weight: 600;
      }
      .bottom {
        margin-top: auto;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
        padding: 12px;
      }
      .reviewbar {
        height: 38px;
        background: #192b48;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 22px;
        position: sticky;
        top: 0;
        z-index: 5;
        font-size: 11px;
      }
      .reviewbar button {
        padding: 3px 10px;
        background: #304568;
        color: white;
        border: 0;
        font-size: 11px;
      }
      .main {
        margin-left: 224px;
      }
      header {
        height: 62px;
        background: white;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 32px;
        color: var(--muted);
        font-size: 12px;
      }
      .avatar {
        background: #edf2fb;
        border-radius: 50%;
        padding: 9px;
        color: #465c7f;
      }
      .content {
        padding: 28px 32px;
        max-width: 1600px;
        margin: auto;
      }
      .heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 27px;
        letter-spacing: -0.7px;
        margin: 0 0 8px;
        font-weight: 650;
      }
      h2 {
        font-size: 16px;
        margin: 0;
      }
      h3 {
        font-size: 14px;
        margin: 0;
      }
      p {
        line-height: 1.65;
      }
      .muted,
      .heading p {
        color: var(--muted);
        margin: 0;
        font-size: 13px;
      }
      .primary {
        background: var(--blue);
        border-color: var(--blue);
        color: #fff;
      }
      .primary:hover {
        background: #234fb8;
      }
      .tag {
        display: inline-flex;
        gap: 5px;
        align-items: center;
        background: #edf2fa;
        color: #587092;
        font-size: 11px;
        border-radius: 5px;
        padding: 5px 8px;
        white-space: nowrap;
      }
      .tag.green {
        background: #eaf6ef;
        color: #28754e;
      }
      .tag.amber {
        background: #fff5e5;
        color: #99671e;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin: 20px 0;
      }
      input,
      select,
      textarea {
        border: 1px solid #dce2ec;
        border-radius: 6px;
        padding: 10px 12px;
        background: white;
        color: inherit;
        max-width: 100%;
      }
      input[type="search"] {
        flex: 1;
      }
      label {
        display: block;
        color: #607089;
        font-size: 12px;
      }
      label input,
      label textarea,
      label select {
        display: block;
        margin-top: 8px;
        width: 100%;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }
      .card,
      .panel {
        background: white;
        border: 1px solid var(--line);
        border-radius: 9px;
        min-width: 0;
      }
      .card {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .cardtop,
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .cardicon {
        background: #edf3ff;
        color: #426ccb;
        padding: 11px;
        border-radius: 9px;
      }
      .card h2 {
        font-size: 17px;
      }
      .card p {
        color: var(--muted);
        font-size: 13px;
        margin: 0;
        min-height: 42px;
      }
      .cardmeta {
        display: flex;
        gap: 20px;
        font-size: 12px;
        color: #6e7e94;
      }
      .cardmeta b {
        color: #37485f;
      }
      .cardfoot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid #edf0f5;
        padding-top: 16px;
        margin-top: auto;
      }
      .sectionhead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 28px 0 14px;
      }
      .panelhead {
        padding: 17px 20px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .pad {
        padding: 20px;
      }
      .split {
        display: grid;
        grid-template-columns: 1.6fr 1fr;
        gap: 20px;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-bottom: 22px;
      }
      .summary .panel {
        padding: 18px 20px;
      }
      .summary b {
        font-size: 24px;
        display: block;
        margin-bottom: 6px;
      }
      .summary span {
        font-size: 12px;
        color: var(--muted);
      }
      .wsbar {
        padding: 20px 32px 0;
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .wsbar .row {
        margin-bottom: 20px;
      }
      .wsname {
        flex-wrap: wrap;
        max-width: 100%;
        font-weight: 600;
        font-size: 18px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .tabs {
        display: flex;
        gap: 24px;
        overflow: auto;
      }
      .tabs button {
        border: 0;
        border-radius: 0;
        background: none;
        padding: 14px 0;
        color: #738098;
        white-space: nowrap;
      }
      .tabs button.active {
        border-bottom: 2px solid var(--blue);
        color: var(--blue);
        font-weight: 600;
      }
      .gridtable {
        overflow: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 12px;
        text-align: left;
      }
      th {
        font-weight: 500;
        color: #718199;
        background: #fafbfe;
        white-space: nowrap;
      }
      th,
      td {
        padding: 13px 16px;
        border-bottom: 1px solid #edf0f5;
      }
      td {
        line-height: 1.5;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      .line {
        padding: 14px 0;
        border-bottom: 1px solid #edf0f5;
      }
      .line:last-child {
        border: 0;
      }
      .line small {
        display: block;
        color: var(--muted);
        margin-top: 5px;
      }
      .linkbutton {
        border: 0;
        background: none;
        color: var(--blue);
        padding: 0;
      }
      .editor {
        display: grid;
        grid-template-columns: 205px minmax(280px, 1fr) 300px;
        min-height: 470px;
      }
      .objects {
        border-right: 1px solid var(--line);
        padding: 16px 12px;
      }
      .objects small {
        display: block;
        font-size: 10px;
        letter-spacing: 1px;
        color: var(--muted);
        padding: 12px 8px;
      }
      .objects button {
        display: block;
        text-align: left;
        font-size: 12px;
        border: 0;
        padding: 10px 8px;
        width: 100%;
        background: none;
      }
      .objects button.selected {
        background: #edf2ff;
        color: var(--blue);
        border-radius: 6px;
      }
      .canvas {
        position: relative;
        padding: 26px;
        background-color: #fbfcff;
        background-image: radial-gradient(#dfe5ef 0.8px, transparent 0.8px);
        background-size: 16px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
      }
      .node {
        border: 1px solid #ccd9ee;
        background: #fff;
        border-radius: 8px;
        padding: 18px;
        width: 220px;
        font-size: 13px;
      }
      .node.metric {
        border-left: 4px solid var(--blue);
        background: #f6f9ff;
      }
      .node small {
        display: block;
        font-size: 10px;
        color: #7f8da3;
        letter-spacing: 1px;
        margin-bottom: 8px;
      }
      .node p {
        font-size: 11px;
        margin: 8px 0 0;
        color: var(--muted);
      }
      .connector {
        height: 42px;
        border-left: 1.5px solid #87a3d5;
        position: relative;
      }
      .connector:after {
        content: "";
        position: absolute;
        bottom: -1px;
        left: -4px;
        width: 6px;
        height: 6px;
        border-right: 1.5px solid #87a3d5;
        border-bottom: 1.5px solid #87a3d5;
        transform: rotate(45deg);
      }
      .inspector {
        padding: 20px;
        border-left: 1px solid var(--line);
      }
      .inspector label {
        margin: 8px 0;
      }
      .inspector input,
      .inspector textarea {
        font-size: 12px;
      }
      .inspector textarea {
        min-height: 75px;
      }
      .code {
        font:
          12px ui-monospace,
          monospace;
        background: #f6f8fc;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 14px;
        line-height: 1.7;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .hint {
        border-left: 3px solid #9bb7ed;
        background: #eff4fd;
        padding: 13px 16px;
        color: #57708d;
        font-size: 12px;
        line-height: 1.65;
        margin: 18px 0;
      }
      .chat {
        display: grid;
        grid-template-columns: 220px 1fr;
        min-height: 510px;
      }
      .history {
        border-right: 1px solid var(--line);
        padding: 18px;
        background: #fafbfe;
      }
      .history button {
        width: 100%;
        text-align: left;
        margin-top: 14px;
        font-size: 12px;
      }
      .conversation {
        padding: 26px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .message {
        background: #f5f8ff;
        border: 1px solid #e0e8f7;
        border-radius: 9px;
        padding: 16px;
        font-size: 13px;
        line-height: 1.7;
      }
      .message.user {
        align-self: flex-end;
        background: #edf2ff;
        max-width: 85%;
      }
      .answer {
        background: #fff;
      }
      .composer {
        margin-top: auto;
        border: 1px solid #ccd9ee;
        border-radius: 9px;
        padding: 12px;
      }
      .composer textarea {
        border: 0;
        width: 100%;
        resize: vertical;
      }
      .small {
        font-size: 11px;
        color: var(--muted);
      }
      .actionrow {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      #toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: #20334f;
        color: white;
        padding: 14px 20px;
        border-radius: 8px;
        z-index: 20;
        max-width: 90vw;
        font-size: 13px;
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 12px;
        max-width: 620px;
        width: 90vw;
        padding: 28px;
      }
      dialog::backdrop {
        background: #162b4855;
      }
      .reviewlist {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
        margin-top: 20px;
      }
      .reviewlist button {
        text-align: left;
        font-size: 12px;
      }
      .empty {
        padding: 60px 25px;
        text-align: center;
      }
      .empty h2 {
        margin: 16px;
      }
      .empty p {
        color: var(--muted);
        max-width: 500px;
        margin: 15px auto;
      }
      .statusdot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .aside-note {
        font-size: 11px;
        color: #8390a4;
        margin: 12px;
      }
      .checklist {
        margin: 0;
        padding-left: 18px;
        color: #607089;
        line-height: 2;
      }
      .twofields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .formstack {
        display: grid;
        gap: 16px;
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 1.5px;
        color: #8090a6;
        margin-bottom: 10px;
      }
      .divider {
        height: 1px;
        background: var(--line);
        margin: 18px 0;
      }
      @media (max-width: 1150px) {
        .cards {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .editor {
          grid-template-columns: 180px 1fr;
        }
        .inspector {
          grid-column: 1/-1;
          border-top: 1px solid var(--line);
          border-left: 0;
        }
        .inspector .formstack {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 800px) {
        aside {
          position: static;
          width: auto;
          padding: 15px;
        }
        .brand {
          padding: 4px 10px 12px;
        }
        .brand small,
        .navlabel,
        .bottom {
          display: none;
        }
        nav {
          display: flex;
          flex-wrap: wrap;
        }
        nav button {
          padding: 9px;
          font-size: 12px;
        }
        .main {
          margin: 0;
        }
        .content {
          padding: 22px 18px;
        }
        header,
        .wsbar {
          padding-left: 18px;
          padding-right: 18px;
        }
        .split {
          grid-template-columns: 1fr;
        }
        .summary {
          grid-template-columns: repeat(2, 1fr);
        }
        .chat {
          grid-template-columns: 1fr;
        }
        .history {
          display: none;
        }
        .heading {
          flex-wrap: wrap;
        }
        .reviewbar {
          height: auto;
          min-height: 38px;
          padding: 8px 14px;
          flex-wrap: wrap;
        }
        .editor {
          grid-template-columns: 1fr;
        }
        .objects {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .objects button {
          display: inline-block;
          width: auto;
        }
        .canvas {
          min-height: 380px;
        }
        .cards {
          grid-template-columns: 1fr;
        }
        .wsbar .row {
          flex-wrap: wrap;
        }
        .cardmeta {
          flex-wrap: wrap;
        }
        .twofields {
          grid-template-columns: 1fr;
        }
        .inspector .formstack {
          grid-template-columns: 1fr;
        }
        .reviewlist {
          grid-template-columns: 1fr;
        }
        .tabs {
          gap: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="reviewbar">
      <span
        >DESIGN REVIEW · Illustrative data · No live API calls or
        execution</span
      >
      <div class="actionrow">
        <span id="pagecount"></span><button id="prev">Previous</button
        ><button id="next">Next page</button
        ><button id="index">Page index</button>
      </div>
    </div>

          };
          $("chatform").onsubmit = (e) => {
            e.preventDefault();
            question = $("question").value;
            chatstage = 1;
            render();
          };
          if ($("runquery"))
            $("runquery").onclick = () => {
              chatstage = 2;
              render();
            };
        }
        if (page === "builders")
          $("viewexternal").onclick = () => {
            selected = "helios";
            go("external");
          };
      }
      $("close").onclick = () => $("dialog").close();
      $("dialog").addEventListener("click", (e) => {
        if (e.target.closest("[data-page]")) $("dialog").close();
      });
      $("prev").onclick = () => navigate(-1);
      $("next").onclick = () => navigate(1);
      function navigate(dir) {
        const index = pages.findIndex((p) => p[0] === page);
        const dest = pages[(index + dir + pages.length) % pages.length][0];
        selected = dest === "external" ? "helios" : "finance";
        go(dest);
      }
      $("index").onclick = () =>
        dialog(
          "Page-by-page review",
          '<p class="muted" style="margin-top:15px">Review the catalog first, then follow the built-in workflow within the same shell.</p><div class="reviewlist">' +
            pages
              .map(
                ([p, n], i) =>
                  `<button data-jump="${p}">${String(i + 1).padStart(2, "0")} · ${n}</button>`,
              )
              .join("") +
            "</div>",
        );
      $("dialog").addEventListener("click", (e) => {
        const b = e.target.closest("[data-jump]");
        if (b) {
          selected = b.dataset.jump === "external" ? "helios" : "finance";
          $("dialog").close();
          go(b.dataset.jump);
        }
      });
      const initial = location.hash.slice(1);
      if (pages.some((p) => p[0] === initial)) {
        page = initial;
        selected = page === "external" ? "helios" : "finance";
      }
      window.addEventListener("hashchange", () => {
        const destination = location.hash.slice(1);
        if (destination !== page && pages.some(p => p[0] === destination)) {
          page = destination;
          selected = page === "external" ? "helios" : "finance";
          render();
        }
      });
      render();
    </script>
  </body>
</html>
