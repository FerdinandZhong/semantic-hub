<text data-id="human-title" x="82" y="776.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#14243B">Business review and sign-off</text>
<text data-id="human-line-0" x="82" y="820.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52647A">Review proposed changes and output contract</text>
<text data-id="human-line-1" x="82" y="852.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52647A">Approve the exact artifact version</text>
<polyline points="1430,625 1430,740" fill="none" stroke="#245EDB" stroke-width="2" marker-end="url(#arrow)"/>
