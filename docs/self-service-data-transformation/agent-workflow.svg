<text data-id="mapper-title" x="82" y="534.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#14243B">Mapper / Interpreter</text>
<text data-id="mapper-line-0" x="82" y="578.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52647A">Resolve schemas, paths, and dependencies</text>
