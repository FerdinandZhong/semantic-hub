<text data-id="privacy-line-0" x="642" y="280.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52647A">IT creates intake DDL + Atlas PII tags</text>
<text data-id="privacy-line-1" x="642" y="312.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52647A">Only approved, sanitized context reaches AI</text>
<rect x="1180" y="200" width="500" height="155" rx="12" fill="#EDF3FF" stroke="#CCD7E4" stroke-width="2"/>
<text data-id="coordinator-title" x="1202" y="236.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#14243B">Workflow coordinator</text>
<text data-id="coordinator-line-0" x="1202" y="280.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52647A">Tracks dependencies, artifacts, and approvals</text>
<text data-id="coordinator-line-1" x="1202" y="312.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52647A">Routes retries; binds execution to approved version</text>
