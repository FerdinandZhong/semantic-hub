<polyline points="1180,775 1150,775 1150,665 870,665 870,625" fill="none" stroke="#245EDB" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 6"/>
<text data-id="retry-label" x="740" y="702.5" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#245EDB">Failed checks → revise</text>
<rect x="60" y="1030" width="500" height="155" rx="12" fill="#FFF3DF" stroke="#CCD7E4" stroke-width="2"/>
<text data-id="it-title" x="82" y="1066.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#14243B">IT executes approved DDL</text>
<text data-id="it-line-0" x="82" y="1110.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52647A">Create Hive tables; confirm Atlas PII tags</text>
<text data-id="it-line-1" x="82" y="1142.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52647A">Grant runtime access after governance checks</text>
<rect x="620" y="1030" width="500" height="155" rx="12" fill="white" stroke="#CCD7E4" stroke-width="2"/>
<text data-id="executor-tag" x="642" y="1061.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#245EDB">AGENT 6</text>
<text data-id="executor-title" x="642" y="1094.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#14243B">Executor</text>
<text data-id="executor-line-0" x="642" y="1138.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52647A">Require business approval + IT readiness</text>
<text data-id="executor-line-1" x="642" y="1170.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52647A">Run the approved PySpark pipeline</text>
<rect x="1180" y="1030" width="500" height="155" rx="12" fill="#F0F8F3" stroke="#CCD7E4" stroke-width="2"/>
<text data-id="outputs-title" x="1202" y="1066.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#14243B">Parallel delivery</text>
<text data-id="outputs-line-0" x="1202" y="1110.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52647A">Hive external tables + downstream CSVs</text>
<text data-id="outputs-line-1" x="1202" y="1142.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52647A">Retain PySpark scripts and run evidence</text>
<polyline points="310,895 310,1030" fill="none" stroke="#245EDB" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="560,1107 620,1107" fill="none" stroke="#245EDB" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1120,1107 1180,1107" fill="none" stroke="#245EDB" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="620" y="1270" width="1060" height="80" rx="12" fill="#F0F8F3" stroke="#CCD7E4" stroke-width="2"/>
<text data-id="reconcile-title" x="642" y="1308.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#14243B">Reconcile legacy CSVs ↔ new CSVs ↔ Hive tables → business-approved cutover</text>
<polyline points="1430,1185 1430,1270" fill="none" stroke="#245EDB" stroke-width="2" marker-end="url(#arrow)"/>
<text data-id="footer-0" x="50" y="1412.5" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#52647A">Orange boxes: human / IT gates. Dashed arrows: feedback before execution. The coordinator manages all six agents.</text>
<text data-id="footer-1" x="50" y="1438.5" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#52647A">Raw PII stays outside LLM prompts. Atlas classification informs an enforced masking / access policy; tags alone do not block access.</text>
</svg>
