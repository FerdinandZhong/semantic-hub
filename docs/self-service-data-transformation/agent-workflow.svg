<text data-id="input-line-0" x="82" y="280.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52647A">CSV files + MySQL / Excel logic</text>
<text data-id="input-line-1" x="82" y="312.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52647A">Restricted landing area; no direct LLM access</text>
<rect x="620" y="200" width="500" height="155" rx="12" fill="#FFF3DF" stroke="#CCD7E4" stroke-width="2"/>
