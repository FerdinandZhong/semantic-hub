<text data-id="validator-title" x="1202" y="804.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#14243B">Validator</text>
<text data-id="validator-line-0" x="1202" y="848.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52647A">Check code, schema, and equivalent results</text>
<text data-id="validator-line-1" x="1202" y="880.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52647A">Use sanitized fixtures in an isolated test</text>
<rect x="620" y="740" width="500" height="155" rx="12" fill="white" stroke="#CCD7E4" stroke-width="2"/>
<text data-id="documenter-tag" x="642" y="771.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#245EDB">AGENT 5</text>
<text data-id="documenter-title" x="642" y="804.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#14243B">Documenter</text>
<text data-id="documenter-line-0" x="642" y="848.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52647A">Explain consolidation, tests, and lineage</text>
<text data-id="documenter-line-1" x="642" y="880.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52647A">Produce a versioned execution report</text>
