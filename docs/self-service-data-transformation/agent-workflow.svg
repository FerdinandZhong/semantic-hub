<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1480" viewBox="0 0 1740 1480" role="img">
<title>Self-service data transformation</title><desc>Consolidate business logic into reviewed PySpark pipelines, governed Hive tables, and parallel CSV outputs.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#245EDB"/></marker></defs>
<rect width="1740" height="1480" fill="#F5F8FC"/>
<text data-id="brand" x="50" y="36.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#245EDB">INDEPENDENT USE CASE  /  PROPOSED DESIGN</text>
<text data-id="title" x="50" y="87.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#14243B">Self-service data transformation</text>
<text data-id="subtitle" x="50" y="134.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52647A">Consolidate business logic into reviewed PySpark pipelines, governed Hive tables, and parallel CSV outputs.</text>
<rect x="60" y="200" width="500" height="155" rx="12" fill="white" stroke="#CCD7E4" stroke-width="2"/>
