<rect x="620" y="470" width="500" height="155" rx="12" fill="#EDF3FF" stroke="#CCD7E4" stroke-width="2"/>
<text data-id="converter-tag" x="642" y="501.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#245EDB">AGENT 2</text>
<text data-id="converter-title" x="642" y="534.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#14243B">SQL / Excel Converter</text>
<text data-id="converter-line-0" x="642" y="578.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52647A">Merge common logic → fewer PySpark jobs</text>
<text data-id="converter-line-1" x="642" y="610.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52647A">Example target: 15 scripts → 4</text>
<rect x="1180" y="470" width="500" height="155" rx="12" fill="white" stroke="#CCD7E4" stroke-width="2"/>
<text data-id="creator-tag" x="1202" y="501.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#245EDB">AGENT 3</text>
<text data-id="creator-title" x="1202" y="534.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#14243B">Folder / Table Structure Creator</text>
<text data-id="creator-line-0" x="1202" y="578.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52647A">Plan /input, /output, /tables paths</text>
<text data-id="creator-line-1" x="1202" y="610.0" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#52647A">Generate Hive external-table DDL for IT</text>
