[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-hub-mcp"
version = "0.1.0"
description = "Read-only MCP adapter for the Semantic Hub demo HTTP API"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
semantic-hub-mcp = "semantic_hub_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
