name: Semantic Hub
description: >-
  Semantic Hub v2 with a built-in semantic Studio and independently deployed
  Helios builder. Supports bundled, external, and built-in-only installation.
  External Helios integration provides workspace navigation; release import
  and delegated queries are not included.
author: Cloudera Engineering
date: '2026-10-27'
specification_version: '1.0'
prototype_version: '2.0'
runtimes:
  - editor: JupyterLab
    kernel: Python 3.11
    edition: Standard
environment_variables:
  SEMANTIC_HUB_PROVIDER_MODE:
    default: bundled
    description: bundled creates Helios applications; external links an existing deployment; builtin_only installs Hub alone.
    required: true
  HELIOS_UI_ORIGIN:
    default: ""
    description: Authenticated HTTPS Helios UI origin. Required in external mode; used in bundled mode when the management API omits application URLs.
    required: false
  HELIOS_API_ORIGIN:
    default: ""
    description: Authenticated HTTPS Helios API origin. Required in external mode; used in bundled mode when the management API omits application URLs.
    required: false
  SEMANTIC_HUB_RUNTIME_IDENTIFIER:
    default: ""
    description: Exact CAI Standard Python 3.11 runtime identifier for the Helios applications. Required in bundled mode.
    required: false
  HELIOS_CAI_PROXY_AUTH_CONFIRMED:
    default: "0"
    description: Set to 1 only after verifying that CAI ingress authenticates users and replaces client-supplied identity headers. Required for bundled native Helios; this setting is not an authentication test.
    required: false
  SEMANTIC_HUB_STATE_DIR:
    default: /home/cdsw/state/semantic-hub
    description: Persistent project directory for models, versions, uploads, SQLite, Lance, and encrypted model credentials. Retain this directory across restarts.
    required: true
  HELIOS_DEMO_DATASET:
    default: finance
    description: Initial source (finance, manufacturing, pharma, power, or pharma_intelligence). All built-in sources remain available in the Hub.
    required: true
  INFERENCE_BASE_URL:
    default: https://api.openai.com/v1
    description: Optional OpenAI-compatible model endpoint. Configure credentials and model profiles in Model configuration after launch.
    required: false
  INFERENCE_MODEL:
    default: gpt-4o
    description: Optional inherited model identifier. No API key is required to install or open the Hub.
    required: false
tasks:
  - type: create_job
    name: semantic-hub-setup
    entity_label: semantic-hub-setup
    script: deployment/cai/prepare.py
    kernel: python3
    cpu: 2
    memory: 8
    timeout: 45
  - type: run_job
    entity_label: semantic-hub-setup
    wait_for: true
  - type: create_job
    name: semantic-hub-provision
    entity_label: semantic-hub-provision
    script: deployment/cai/provision.py
    kernel: python3
    cpu: 1
    memory: 2
    timeout: 30
  - type: run_job
    entity_label: semantic-hub-provision
    wait_for: true
  - type: start_application
    name: Semantic Hub
    entity_label: semantic-hub-app
    subdomain: semantic-hub
    script: deployment/launchers/hub.py
    kernel: python3
    cpu: 2
    memory: 8
    gpu: 0
    bypass_authentication: false
